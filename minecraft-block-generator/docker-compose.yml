services:
  app:
    build: .
    container_name: laravel_app
    volumes:
      - ./:/var/www

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  
  adminer:
    image: adminer
    ports:
      - "8080:8080"
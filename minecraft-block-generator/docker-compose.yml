services:
  app:
    build: .
    container_name: laravel_app
    volumes:
      - ./:/var/www

  nginx:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
  
  sqlite-web:
    image: coleifer/sqlite-web
    container_name: sqlite-web
    ports:
      - "8081:8080"
    volumes:
      - ./database:/data
    command: sqlite_web -H 0.0.0.0 /data/database.sqlite
    depends_on:
      - app